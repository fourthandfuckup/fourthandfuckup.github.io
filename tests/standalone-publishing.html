<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tribune Standalone Contract Tests</title><meta name="robots" content="noindex,nofollow"></head><body><h1>Standalone Publishing Contract Tests</h1><pre id="results"></pre><script src="../standalone-publishing-contract.js"></script><script>
const t=window.TribuneStandalone;
const draft={headline:'Frank’s $74 Investigation!',author:'Frank',summary:'An expensive lesson',story:'This investigation contains a full fifty-character story for testing newsroom publishing validation.',categories:["Frank's Desk"]};
const checks=[
 ['valid article',t.validate(draft).ok],
 ['missing headline',!t.validate({...draft,headline:''}).ok],
 ['missing teaser',!t.validate({...draft,summary:''}).ok],
 ['short article',!t.validate({...draft,story:'tiny'}).ok],
 ['missing category',!t.validate({...draft,categories:[]}).ok],
 ['safe URL slug',t.slugify(draft.headline)==='frank-s-74-investigation'],
 ['staging never public',t.build(draft,'11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222').is_public===false],
 ['unsaved draft rejected',(()=>{try{t.build(draft,'','22222222-2222-4222-8222-222222222222');return false}catch(e){return true}})()]
];
document.getElementById('results').textContent=checks.map(([name,pass])=>(pass?'PASS':'FAIL')+' — '+name).join('\n')+'\n\n'+checks.filter(x=>x[1]).length+'/'+checks.length+' checks passed.';
</script></body></html>
